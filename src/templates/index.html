<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diverse Legal Case Retrieval</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .badge-aspect { margin-right: 2px; }
        .dup-marker { color: #dc3545; font-weight: bold; font-size: 0.8em; }
        .result-card { margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .metrics-card { padding: 15px; border-radius: 5px; background: #f8f9fa; margin-bottom: 20px;}
        .metric-val { font-size: 1.5em; font-weight: bold; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Submodular Legal Retrieval</a>
  </div>
</nav>

<div class="container mt-4">
    
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <h5>Search Controls</h5>
                    <div class="row">
                        <div class="col-md-6">
                            <label>Select Query (or type custom below)</label>
                            <select id="querySelect" class="form-select" onchange="runSearch()">
                                <option value="">Loading queries...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label>&lambda; (Diversity Trade-off)</label>
                            <input type="range" class="form-range" id="lambdaSlider" min="0" max="1" step="0.1" value="0.5" onchange="updateLambdaLabel(); runSearch()">
                            <span id="lambdaLabel">0.5</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- BM25 Column -->
        <div class="col-md-6">
            <h4 class="text-primary">BM25 Top-K (Baseline)</h4>
            <div class="metrics-card" id="bm25Metrics">
                <div>Metrics will appear here</div>
            </div>
            <div id="bm25Results"></div>
        </div>
        
        <!-- Proposed Column -->
        <div class="col-md-6">
            <h4 class="text-success">Submodular Selection (Proposed)</h4>
            <div class="metrics-card" id="propMetrics">
                <div>Metrics will appear here</div>
            </div>
            <div id="propResults"></div>
        </div>
    </div>
</div>

<script>
    let aspectColors = {};

    function getAspectColor(aspect) {
        if (!aspectColors[aspect]) {
            // Generate a random color based on aspect ID
            const hue = (aspect * 137.508) % 360; 
            aspectColors[aspect] = `hsl(${hue}, 70%, 40%)`;
        }
        return aspectColors[aspect];
    }

    function updateLambdaLabel() {
        document.getElementById('lambdaLabel').innerText = document.getElementById('lambdaSlider').value;
    }

    async function fetchQueries() {
        const res = await fetch('/api/queries');
        const queries = await res.json();
        const select = document.getElementById('querySelect');
        select.innerHTML = '';
        queries.forEach(q => {
            const opt = document.createElement('option');
            opt.value = q.id;
            opt.text = `${q.id} - ${q.preview}`;
            select.appendChild(opt);
        });
        if(queries.length > 0) runSearch();
    }

    function renderResults(containerId, results) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        results.forEach((r, idx) => {
            let badges = r.aspects.map(a => `<span class="badge badge-aspect" style="background-color: ${getAspectColor(a)}">Aspect ${a}</span>`).join('');
            container.innerHTML += `
                <div class="result-card">
                    <strong>#${idx+1} ${r.id}</strong> (Score: ${r.score.toFixed(3)}) <span class="dup-marker">[Cluster ${r.cluster_id}]</span><br>
                    ${badges}<br>
                    <small>${r.snippet}</small>
                </div>
            `;
        });
    }

    function renderMetrics(containerId, metrics) {
        const container = document.getElementById(containerId);
        if(!metrics || Object.keys(metrics).length === 0) {
            container.innerHTML = '<span class="text-muted">No Ground Truth (Custom Query)</span>';
            return;
        }
        
        let html = '<div class="row text-center">';
        for (const [key, val] of Object.entries(metrics)) {
            html += `
                <div class="col">
                    <div style="font-size: 0.8em; color: #666;">${key}</div>
                    <div class="metric-val">${val.toFixed(3)}</div>
                </div>
            `;
        }
        html += '</div>';
        container.innerHTML = html;
    }

    async function runSearch() {
        const qid = document.getElementById('querySelect').value;
        const lambd = document.getElementById('lambdaSlider').value;
        if(!qid) return;

        // Fetch BM25
        const resBm25 = await fetch(`/api/search?qid=${qid}&method=bm25&K=10`);
        const dataBm25 = await resBm25.json();
        renderResults('bm25Results', dataBm25.results);
        renderMetrics('bm25Metrics', dataBm25.metrics);

        // Fetch Proposed
        const resProp = await fetch(`/api/search?qid=${qid}&method=proposed&K=10&lambda=${lambd}`);
        const dataProp = await resProp.json();
        renderResults('propResults', dataProp.results);
        renderMetrics('propMetrics', dataProp.metrics);
    }

    window.onload = () => {
        fetchQueries();
    };
</script>
</body>
</html>
